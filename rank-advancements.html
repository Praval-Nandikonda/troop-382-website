<!DOCTYPE html>
<html>
<head>
    <title>Rank Advancement Tracker</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f0f4f8;
        }
        h1 {
            text-align: center;
        }
        .name-box, .rank-select {
            margin: 20px auto;
            display: block;
            padding: 10px;
            font-size: 16px;
        }
        .req {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 12px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .req.completed {
            background: #d4f8d4;
        }
        .req input {
            margin-right: 10px;
            transform: scale(1.3);
        }
        .progress-container {
            width: 100%;
            background: #ddd;
            border-radius: 20px;
            margin: 20px 0;
            height: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.4s ease;
        }
        .toggle-container {
            margin: 10px 0;
        }
    </style>
</head>
<body>

<h1>Rank Advancement Tracker</h1>

<input id="scoutName" class="name-box" placeholder="Enter your name">

<select id="rankSelect" class="rank-select">
    <option value="scout">Scout</option>
    <option value="tenderfoot">Tenderfoot</option>
    <option value="secondclass">Second Class</option>
    <option value="firstclass">First Class</option>
    <option value="star">Star</option>
    <option value="life">Life</option>
    <option value="eagle">Eagle</option>
</select>

<div class="toggle-container">
    <label>
        <input type="checkbox" id="showIncomplete">
        Show only incomplete requirements
    </label>
</div>

<div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div id="requirements"></div>

<script>
const rankRequirements = {
    scout: [
        "Learn and repeat the Scout Oath",
        "Learn and repeat the Scout Law",
        "Explain patrol method",
        "Show how to tie a square knot"
    ],
    tenderfoot: [
        "Camp overnight",
        "Demonstrate basic first aid",
        "Explain the buddy system",
        "Show how to whip and fuse a rope"
    ],
    secondclass: [
        "Cook a meal on a campout",
        "Use a map and compass",
        "Demonstrate fire building",
        "Show swimming skills"
    ],
    firstclass: [
        "Plan a patrol activity",
        "Navigate using a map and compass",
        "Identify 10 plants/animals",
        "Demonstrate lashings"
    ],
    star: [
        "Earn 6 merit badges",
        "Serve in a leadership position",
        "Complete service hours"
    ],
    life: [
        "Earn 5 more merit badges",
        "Serve in leadership",
        "Plan and participate in service"
    ],
    eagle: [
        "Earn 21 merit badges",
        "Serve actively in troop",
        "Plan and complete Eagle Project"
    ]
};

function getKey(name, rank, index) {
    return `${name}-${rank}-${index}`;
}

function loadRank(rank) {
    const name = document.getElementById("scoutName").value.trim();
    if (!name) {
        document.getElementById("requirements").innerHTML =
            "<p style='color:red;'>Enter your name to load progress.</p>";
        return;
    }

    const container = document.getElementById("requirements");
    container.innerHTML = "";

    const reqs = rankRequirements[rank];
    let completedCount = 0;

    reqs.forEach((req, index) => {
        const key = getKey(name, rank, index);
        const saved = localStorage.getItem(key) === "true";

        if (saved) completedCount++;

        const div = document.createElement("div");
        div.className = "req" + (saved ? " completed" : "");
        div.innerHTML = `
            <input type="checkbox" id="${key}" ${saved ? "checked" : ""}>
            <label for="${key}">${req}</label>
        `;

        div.querySelector("input").addEventListener("change", (e) => {
            localStorage.setItem(key, e.target.checked);
            loadRank(rank);
        });

        container.appendChild(div);
    });

    updateProgress(completedCount, reqs.length);
    applyFilter();
}

function updateProgress(done, total) {
    const bar = document.getElementById("progressBar");
    const percent = (done / total) * 100;
    bar.style.width = percent + "%";
}

function applyFilter() {
    const showIncomplete = document.getElementById("showIncomplete").checked;
    document.querySelectorAll(".req").forEach(req => {
        if (showIncomplete && req.classList.contains("completed")) {
            req.style.display = "none";
        } else {
            req.style.display = "flex";
        }
    });
}

document.getElementById("rankSelect").addEventListener("change", (e) => {
    loadRank(e.target.value);
});

document.getElementById("showIncomplete").addEventListener("change", applyFilter);

document.getElementById("scoutName").addEventListener("input", () => {
    loadRank(document.getElementById("rankSelect").value);
});
</script>

</body>
</html>
